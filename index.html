<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskAlarm - Gestione Task e Sveglia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>TaskAlarm</h1>
            <p>Imposta i tuoi obiettivi, noi ti ricordiamo.</p>
        </header>

        <section class="input-section">
            <input type="text" id="taskName" placeholder="Cosa devi fare?" required>
            <input type="time" id="taskTime" required>
            <button id="addTaskBtn">Aggiungi Task</button>
        </section>

        <section class="list-section">
            <h2>Task in programma</h2>
            <ul id="taskList">
                <!-- I task appariranno qui dinamicamente -->
            </ul>
        </section>
<div id="wakeLockStatus" class="wake-lock-info">
    <span class="dot"></span> Modalità Schermo Attivo: <span id="statusText">Disattivata</span>
</div>
        <footer class="actions">
            <button id="exportData" class="secondary">Esporta JSON</button>
            <button id="importData" class="secondary">Importa JSON</button>
            <button id="shareBtn" class="secondary" style="background-color: #2ed573;">Condividi App</button>
        </footer>

        <div id="installInstructions" class="instructions">
            💡 <strong>Come installare:</strong><br>
            Clicca sui 3 puntini del browser e seleziona "Aggiungi a schermo segnapunti" o "Installa app".
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
